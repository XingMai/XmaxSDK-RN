apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'
android {
  namespace 'ai.xmax.reactnative'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    minSdk 26
    consumerProguardFiles 'consumer-rules.pro'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}
react {
  jsRootDir = file('../src/Foundation/Native')
  libraryName = 'XmaxRuntimeSpec'
  codegenJavaPackageName = 'ai.xmax.reactnative'
}
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.volcengine:VolcEngineRTC:3.58.1.55100'
  implementation 'com.volcengine:VolcApiEngine:1.6.6'
  // Resolve the already autolinked peer by package identity, including aliased installs.
  def rtcPeer = rootProject.subprojects.find { candidate ->
    def manifest = new File(candidate.projectDir, '../package.json')
    manifest.exists() && new groovy.json.JsonSlurper().parse(manifest).name == '@volcengine/react-native-rtc'
  }
  if (rtcPeer == null) throw new GradleException('Autolink @volcengine/react-native-rtc before building XmaxSDK')
  implementation project(rtcPeer.path)
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'com.alibaba:fastjson:1.2.79'
}
